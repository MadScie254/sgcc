# SGCC Theft Detector configuration.
# Paths are relative to the repository root.

random_state: 42

data:
  # Full SGCC dataset used for training (not committed; see scripts/download_data.py).
  training_data_path: "data/sgcc_full.csv"
  # Held-out customers the API serves. Written by training, committed to the repo.
  serving_data_path: "data/sgcc_demo.csv.gz"

features:
  sudden_drop_threshold: 0.5      # day-over-day drop counted as "sudden" (50%)
  peak_day_percentile: 0.9        # readings at or above this quantile are peak days
  missing_sequence_threshold: 3   # missing runs longer than this many days are counted
  low_month_ratio: 0.2            # month below 20% of the customer's mean is "low"
  monthly_profile_months: 34      # trailing months kept as relative-consumption features
  start_date: "2014-01-01"        # calendar start when the data has no date header

model:
  type: "xgboost"
  version: "2.0.0"

  optuna:
    n_trials: 40
    cv_folds: 5
    timeout: null                 # seconds; null for no limit
    metric: "average_precision"   # or "roc_auc"
    search_space:
      n_estimators: {low: 200, high: 1200, step: 100}
      learning_rate: {low: 0.01, high: 0.1, log: true}
      max_depth: {low: 3, high: 9}
      min_child_weight: {low: 1, high: 20, log: true}
      subsample: {low: 0.6, high: 1.0}
      colsample_bytree: {low: 0.3, high: 1.0}
      gamma: {low: 0.0, high: 5.0}
      reg_alpha: {low: 0.001, high: 10.0, log: true}
      reg_lambda: {low: 0.01, high: 20.0, log: true}
      scale_pos_weight: {low: 1.0, high: 5.0}

  quick_train:
    sample_fraction: 0.25
    n_trials: 5
    cv_folds: 3

evaluation:
  test_size: 0.2
  threshold_strategy: "f1"        # "f1" or "precision" (max recall at min_precision)
  min_precision: 0.5

serving:
  demo_customers: 3000            # held-out customers written to serving_data_path

paths:
  models: "models"
  model_file: "models/xgb_best.ubj"
  artifacts: "artifacts"
  uploads: "data/uploads"
  reports: "artifacts/reports"
