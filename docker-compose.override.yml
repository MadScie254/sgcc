version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1

  web:
    image: node:20-bookworm-slim
    working_dir: /app/frontend
    command: sh -c "npm ci && npm run preview -- --host 0.0.0.0 --port 5173 --strictPort"
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - frontend-node-modules:/app/frontend/node_modules
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_started

volumes:
  frontend-node-modules: