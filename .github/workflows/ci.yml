name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run tests
        run: pytest tests/ -v

  api-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Start API
        env:
          ENV: production
          API_KEY: ci-smoke-key
        run: |
          uvicorn backend.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &

      - name: Wait for API health
        run: |
          for attempt in $(seq 1 60); do
            code=$(curl -s -o health.json -w "%{http_code}" http://127.0.0.1:8000/api/health || true)
            if [ "$code" = "200" ]; then
              python -c "import json, sys; sys.exit(0 if json.load(open('health.json'))['model_loaded'] else 1)"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy within 60 seconds."
          exit 1

      - name: Smoke test secured endpoints
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/customers)" = "401"
          curl -fsS -H "X-API-Key: ci-smoke-key" http://127.0.0.1:8000/api/customers >/dev/null
          curl -fsS -H "X-API-Key: ci-smoke-key" http://127.0.0.1:8000/api/model/metrics >/dev/null

      - name: Show API log on failure
        if: failure()
        run: cat api.log

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
