name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: |
          pytest tests/ -v

  api-smoke-test:
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install git-lfs
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Pull LFS artifacts
        run: git lfs pull

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start API
        env:
          ENV: development
        run: |
          uvicorn backend.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &

      - name: Wait for API health
        run: |
          for attempt in $(seq 1 20); do
            code=$(curl -s -o health.json -w "%{http_code}" http://127.0.0.1:8000/api/health || true)
            if [ "$code" = "200" ]; then
              python -c "import json, sys; payload = json.load(open('health.json', encoding='utf-8')); print('API healthy and model loaded.') if payload.get('model_loaded') is True else (print('API started, but model_loaded is false. Check Phase 2 artifact commit step.'), sys.exit(1))"
              exit 0
            fi
            sleep 1
          done

          echo "API did not become healthy within 20 seconds. Check Phase 2 artifact commit step."
          cat api.log
          exit 1

      - name: Smoke test secured endpoints
        run: |
          curl -fsS http://127.0.0.1:8000/api/customers >/dev/null
          curl -fsS http://127.0.0.1:8000/api/model/metrics >/dev/null

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
